# Phase 1-2 pipeline configuration (download and cleaning of raw FRED data).
# Paths under `paths:` are resolved relative to DATA_DIR (see .env / fred_forecast.config.data_dir()).

# The work uses only monthly series. The downloader supports other valid FRED frequencies
# (see VALID_FREQUENCIES in fred_client.py), but the thesis pipeline is monthly-only.
frequencies:
  - Monthly

tags:
  max_requests_per_minute: 120
  concurrent_requests: 20
  max_retries: 5
  # The checkpoint is only written when a chunk closes, so this value sets how much work is
  # lost if the download gets interrupted. At 120 req/min, 5000 series meant ~42 min of
  # exposure; 250 brings it down to ~2 min. The FRED API returns 429/502 fairly often on long
  # runs, so the lower value is worth the extra disk writes.
  batch_size: 250

cleaning:
  context_months: 48
  max_nan_ratio: 0.25

embeddings:
  model_name: google-t5/t5-base
  max_length: 128
  batch_size: 32

paths:
  raw_dir: raw                  # -> <DATA_DIR>/raw/parquet_<freq>/release_<id>.parquet
  tags_dir: raw/tags            # -> <DATA_DIR>/raw/tags/
  interim_dir: interim          # -> <DATA_DIR>/interim/final_dataset_<freq>/release_<id>.parquet
  processed_dir: processed      # -> <DATA_DIR>/processed/fred_database_context_<N>.json
  embeddings_dir: embeddings    # -> <DATA_DIR>/embeddings/metadata_embeddings.pkl
  series_ids_file: series_ids/series_ids.json
