# Experimental protocol shared by Unimodal-ablation and NeuroSym-CBF (Phase 6).
# "Do not change these values between models" -- original thesis criterion, preserved: these are the
# exact values used to train and evaluate the thesis models.

seed: 40

# Number of PyTorch CPU threads. NOT just a performance knob: it changes the reduction order of
# matmuls and, with it, the training result. Measured on this machine, same seed and same data,
# batch-501 loss goes from 0.3361 (4 threads) to 0.3373 (1 thread), and two runs with the same
# value match exactly. Without pinning it, the repo would not even reproduce its own results
# across machines. Evaluation is insensitive to this (MAE identical to 8 decimals).
num_threads: 4

data:
  min_context_len: 13
  context_len: 30
  horizon_len: 18
  padding_value: -1
  batch_size: 2048
  num_workers: 0    # DataLoader workers -- performance only, does not affect the results
                    # (sample order is fixed by the seeded sampler in the main process).
                    # On Windows keep this at 0: spawn serializes the entire dataset (~1GB) through the pipe
                    # to each worker and the pickle gets truncated (OSError 22). On Linux (fork) it can pay off.

backbone:
  num_blocks: 4
  patch_len: 4
  patch_stride: 2
  d_model: 64
  d_ff_ts: 128
  dropout: 0.1
  seasonality: 12

sae_film:               # used only by NeuroSym-CBF (not by Unimodal-ablation)
  d_ff_meta: 64
  dict_mult: 2
  top_k: 16

training:
  num_epochs: 3
  lr: 0.001
  weight_decay: 0.0001
  scheduler_t_max: 20
  grad_clip_norm: 1.0
