# Baseline hyperparameters (Phase 7). The context length is a per-baseline parameter, not a
# shared fixed value: in the thesis, AutoETS and Chronos-Bolt were run with
# ctx=8 (despite their own comments saying it "must match ctx=30"), while
# Chronos-2 and TimesFM used ctx=30, just like Unimodal-ablation/NeuroSym-CBF. Feel free to
# change these values to rerun any baseline with a different context -- there is no hardcoded
# "correct" value in the code, only what you set here.

seasonality: 12
horizon_len: 18
padding_value: -1

autoets:
  # The variant reported in the thesis (Table 6.1) is 'normafter' -- verified by exact
  # numerical match with the paper at ctx=8 (MAE 0.7808, MASE 3.2380, median sMAPE 91.23%). The other
  # variant ('normbefore', normalize the context before fitting) remains available in the
  # code as an alternative, but it is NOT the one used in the work. Use: 10_evaluate.py --model autoets-normafter
  variant: normafter
  context_len: 8
  n_jobs: 4       # min(4, os.cpu_count()) in the original implementation

chronos_bolt:
  context_len: 8
  min_context_len: 8
  model_id: amazon/chronos-bolt-base
  batch_size: 256

chronos2:
  context_len: 30
  min_context_len: 13
  model_id: amazon/chronos-2
  batch_size: 256

# In-domain deep baseline, trained from scratch with the protocol of configs/model_protocol.yaml
# (scripts/09_train_tft_baseline.py). d_model=68 gives 188,038 trainable parameters, on par with
# NeuroSym-CBF (186,087-188,903 depending on the context length).
tft:
  d_model: 68
  num_heads: 4
  dropout: 0.1

timesfm:
  context_len: 30
  min_context_len: 13
  checkpoint: google/timesfm-1.0-200m-pytorch
  batch_size: 256
