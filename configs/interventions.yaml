# Interventions on the metadata branch of NeuroSym-CBF (script 13).
# Nothing is retrained: they only replace each series' metadata embedding and measure the effect.

# Level 2 -- the NULL. Several seeds, to have a distribution instead of a single number.
permutation_seeds: [0, 1, 2]

# Level 3 -- targeted swaps between semantically different tags.
# `max_pairs` caps the number of pairs per swap (null = as many as the smaller group allows).
# The first one is the original example the experiment started from; the rest have far more volume
# (in monthly FRED only 152 series carry the `gdp` tag -- GDP is quarterly).
tag_swaps:
  - {a: gdp,           b: unemployment, max_pairs: null}
  - {a: cpi,           b: unemployment, max_pairs: 5000}
  - {a: employment,    b: price,        max_pairs: 5000}
  - {a: manufacturing, b: housing,      max_pairs: 2000}
  - {a: inflation,     b: employment,   max_pairs: 5000}

# Level 4 -- negative control: swap between series with the SAME set of tags.
within_tagset_swap:
  enabled: true
  min_group_size: 2

seed: 40
