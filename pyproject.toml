[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fred-forecast"
version = "0.1.0"
description = "Multimodal neurosymbolic forecasting over FRED macroeconomic time series (TFG)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Iker Rosales Saiz" },
    { name = "Pablo Montero-Manso" },
]

# Lower bounds = the versions the pipeline has been verified with end to end.
dependencies = [
    "pandas>=2.3",
    "numpy>=2.4",
    "pyarrow>=23.0",
    "fastparquet>=2025.12",
    "requests>=2.32",
    "aiohttp>=3.13",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "torch>=2.10",
    "transformers>=4.57",
    "sentencepiece>=0.2",
    "accelerate>=1.13",
    "chronos-forecasting>=2.2",
    # NOTE: timesfm is NOT listed here on purpose -- the TimesFM baseline needs timesfm 1.2.x
    # (TimesFm/TimesFmHparams API, timesfm-1.0-200m-pytorch checkpoint), which is no longer on
    # PyPI (2.x changed both the API and the checkpoint). See the README, TimesFM baseline note.
    "statsforecast>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
